name: Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Free disk space
        # Paths from: https://github.com/jlumbroso/free-disk-space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
          # Keep HuggingFace cache in workspace (not ~/.cache) for predictable disk usage
          HF_HOME: ${{ github.workspace }}/.hf
          TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf/transformers
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch (~200MB) instead of CUDA version (~2GB) to save disk space
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-cache-dir -e .[dev]

      - name: Run pytest
        run: python -m pytest -q
